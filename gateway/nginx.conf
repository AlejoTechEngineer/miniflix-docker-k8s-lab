# API Gateway (rol análogo a Zuul en Netflix): punto único de entrada norte-sur
upstream catalog        { server catalog:8000; }
upstream recommendation { server recommendation:8000; }
upstream playback       { server playback:8000; }

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;   # load shedding básico

server {
  listen 8080;
  resolver 127.0.0.11 valid=10s;          # DNS interno de Docker
  add_header X-Gateway "miniflix-edge" always;

  location /api/catalog/ { limit_req zone=api burst=40; proxy_pass http://catalog/; }
  location /api/recs/    { limit_req zone=api burst=40; proxy_pass http://recommendation/recommendations/; }
  location /api/play/    { limit_req zone=api burst=40; proxy_pass http://playback/playback/; }
  location /cdn/         { proxy_pass http://cdn:80/; }   # simula un nodo de borde (OCA)
  location = /health     { return 200 '{"status":"UP","service":"gateway"}'; default_type application/json; }
}
