# Mini-Flix: despliegue local contenerizado de una plataforma de streaming simplificada
name: miniflix

services:
  gateway:
    image: nginx:1.27-alpine
    ports: ["8080:8080"]
    volumes: ["./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      catalog:        { condition: service_healthy }
      recommendation: { condition: service_healthy }
      playback:       { condition: service_healthy }
    networks: [edge, backend]

  catalog:
    build: ./services/catalog
    deploy: { resources: { limits: { cpus: "0.50", memory: 256M } } }
    networks: [backend]

  recommendation:
    build: ./services/recommendation
    environment:
      CATALOG_URL: http://catalog:8000
      REDIS_URL: redis://cache:6379/0
      CACHE_TTL_SECONDS: "60"
    deploy:
      replicas: 2                                   # escalado horizontal independiente
      resources: { limits: { cpus: "0.50", memory: 256M } }
    depends_on:
      catalog: { condition: service_healthy }
      cache:   { condition: service_healthy }
    networks: [backend]

  playback:
    build: ./services/playback
    environment:
      CATALOG_URL: http://catalog:8000
      CDN_BASE_URL: http://localhost:8080/cdn
    deploy: { resources: { limits: { cpus: "0.50", memory: 256M } } }
    depends_on:
      catalog: { condition: service_healthy }
    networks: [backend]

  cache:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    networks: [backend]

  cdn:
    image: nginx:1.27-alpine
    volumes: ["./cdn/content:/usr/share/nginx/html:ro"]
    networks: [backend]

networks:
  edge: {}
  backend: { internal: true }     # los microservicios no quedan expuestos a Internet
